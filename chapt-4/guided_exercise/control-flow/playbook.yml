---
- name:  MariaDB server is running
  hosts:  database_dev
  vars:
    mariadb_packages:
    - mariabd-server
    - python3-PyMySQL
  tasks:
  - name:  MariabDB packages are installed
    ansible.builtin.dnf:
      name:  "{{ item }}"
      state:  present
    loop:  "{{ mariadb_packages }}"
  - name:  Start MariaDB service
    ansible.builtin.service:
     name:  mariadb
     state:  started
     enabeld:  true 

