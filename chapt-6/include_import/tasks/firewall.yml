- name:  Install the firewall
  ansible.builtin.dnf:
    name: "{{ firewall_pkg }}"
    state: latest
- name:  Start the firewall
  ansible.builtin.service:
    name:  "{{ firewall_svc }}"
    state:  started
    enabled:  true

- name: Open the port for {{ rule }}
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:  "{{ rule }}"

