---

- name: Enable intranet services
  hosts:
  - node-1
  - node-2
  become: true
  tasks:  
    - name:  Latest version of httpd and firewalld installed
      ansible.builtin.dnf:
        name: 
        - httpd
        - firewalld
        state:  latest
    - name:  Test html page is installed
      ansible.builtin.copy:
        content:  "Welcome to the example.com intranet!\n"
        dest:  /var/www/html/index.html
    - name:  Firewal enabled and running
      ansible.builtin.service:
        name: firewalld
        enabled:  true
        state:  started
    - name: Firewall permits access to httpd service
      ansible.posix.firewalld:
        service:  http
        permanent:  true
        state:   enabled
        immediate:  true
    - name:  Web server enabled and running
      ansible.builtin.service:
        name:  httpd
        state:  started
        enabled:  true

- name:  node-1 - Test interanet web server
  hosts:
  - node-1
  become:  false
  tasks:
    - name:  Connect to intranet web server
      ansible.builtin.uri:
        url:  http://node-1
        return_content:  true
        status_code:  200

- name:  node-2 - Test interanet web server
  hosts:
  - node-2
  become:  false
  tasks:
    - name:  Connect to intranet web server
      ansible.builtin.uri:
        url:  http://node-2
        return_content:  true
        status_code:  200






  
      
