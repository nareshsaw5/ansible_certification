---
# This is example of multiple play in a playbook

- name:  This is first play
  hosts:  web
  tasks:
    - name:  Install httpd service
      ansible.builtin.package:
        name:  httpd
        state:  present
    - name:  Start httpd service
      ansible.builtin.service:
        name:  httpd
        state:  started
        enabled:  true

- name:  This is second play
  hosts:  db
  tasks:
    - name:  Install mariadb service
      ansible.builtin.package:
        name:  mariadb-server
        state:  present
    - name:  Start mariadb service
      ansible.builtin.service:
        name:  mariadb
        state:  started
        enabled:  true
    
