- name: Touch a file playbook
  hosts: dev
  vars:
    file_name: hello 
  tasks:
  - name:  Touch a file and set permission
    ansible.builtin.file:
      path:  /home/naresh/{{ file_name }}
      owner: naresh
      group: naresh
      mode: 0640
      state: touch
  - name: Add additional line to a file
    ansible.builtin.blockinfile:
      path: /home/naresh/{{ file_name }}
      block: |
        First line
        Second line
      state: present
  - name:  Read the {{ file_name }} file 
    ansible.builtin.command:  cat /home/naresh/{{ file_name }}
    register: content
  - name: Print file content
    ansible.builtin.debug:
      var: content
